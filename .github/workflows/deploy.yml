name: Sync calendars & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build site from calendars
        run: npm run build
        env:
          WORK_ICS_URL: ${{ secrets.WORK_ICS_URL }}
          PERSONAL_ICS_URL: ${{ secrets.PERSONAL_ICS_URL }}
          CALENDAR_PASSCODE: ${{ secrets.CALENDAR_PASSCODE }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
